# B13 (docs/b13_auxiliary_drafter.md): the stage-2 recipe of phaseC_sft3_4b (same base, data, lr, epochs, suffix masks)
# with PLM-style auxiliary inputs on the masked rows (rank of the truth under the model's own AR distribution; 128
# auxiliaries, rank >= 128 -> [MASK]) and the representation-alignment loss (decoder layer 12 vs encoder layer 18, cos,
# learned linear map, weight 1).  Control = runs/phaseC_sft3_4b (the same recipe with [MASK] inputs).
model: runs/phaseC_cpt3_4b/final
data_train: data/distill/phaseA_stage2c_train.jsonl
out_dir: runs/b13_auxalign_4b
block: 32
max_len: 2048
batch: 1
grad_accum: 16
lr: 3e-5
warmup_ratio: 0.03
epochs: 3
save_steps: 500
save_total_limit: 1
seed: 0
mask_mode: suffix
aux_tokens: 128
align_weight: 1.0
align_dec_layer: 12
align_enc_layer: 18
