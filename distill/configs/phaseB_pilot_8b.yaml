# Phase B pilot: LoRA SFT of Qwen3-8B on the Phase A small set. Single shared GPU (physical 5; ~16 GiB weights + activations, batch 2).
model: /mnt/ssd/models/hf/Qwen3-8B
data_train: data/distill/phaseA_small_train.jsonl
data_val: data/distill/phaseA_small_val.jsonl
out_dir: runs/phaseB_pilot_8b
